[tool.poetry]
name = "fastapi-poetry"
version = "0.1.0"
description = "FastAPI fixture using Poetry-style dependency tables."

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.114.0"
uvicorn = { extras = ["standard"], version = "^0.30" }
psycopg2-binary = "^2.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

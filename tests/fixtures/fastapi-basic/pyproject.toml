[project]
name = "fastapi-basic"
version = "0.1.0"
description = "Minimal FastAPI fixture for backend detection."
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "uvicorn>=0.30",
    "psycopg2>=2.9",
]

[dependency-groups]
dev = [
    "pytest<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[package]
name = "webkit"
version = "0.8.1"
edition = "2021"
description = "Ergonomic web framework built on hyper"
license = "MIT"
repository = "https://github.com/example/webkit"

[dependencies]
hyper = { version = "1", features = ["server", "http1"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["full"] }

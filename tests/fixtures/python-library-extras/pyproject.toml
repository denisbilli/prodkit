[project]
name = "toolkit"
version = "1.4.0"
description = "Adapters for language models"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.114",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
toolkit = "toolkit.cli:main"

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Required for npm provenance: the workflow proves to npm that this tarball was
      # built from this commit in this repository. It is why publishing moved to CI —
      # the token never touches a laptop, and the package is verifiable rather than
      # merely trusted.
      id-token: write
      # Required to create the release that carries the notes.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the release notes can be generated from the commits since
          # the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm's OIDC exchange with the registry landed in npm 11.5.1, and the npm that
      # ships with Node 22 is older than that. Without this step the publish below
      # finds no credentials at all and fails.
      - run: npm install -g npm@latest

      - run: npm ci

      # The tag and the manifest must agree. A tag that says v0.3.0 while package.json
      # says 0.2.0 publishes the wrong version under the right name, and npm will not
      # let that version number be reused afterwards.
      - name: Check the tag matches the version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag is v$tag but package.json says $manifest."
            exit 1
          fi
          echo "Publishing version $manifest"

      - run: npm run build
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.test.json
      - run: npm test

      # The guard that matters most: refuses to publish if anything from the commercial
      # AI layer is in dist. A stale build from before the extraction would otherwise
      # ship the paid code under MIT.
      - name: Refuse to publish the AI layer
        run: node scripts/assert-no-ai.mjs

      # No NODE_AUTH_TOKEN: the trusted publisher connection on npm lets this exact
      # workflow, in this exact repository, mint a short-lived credential over OIDC.
      # A token in the environment would be used in preference to that exchange, so
      # its absence is what makes the publish go through the trusted path.
      #
      # --provenance attests that this tarball was built from this commit by this
      # workflow, and anyone can check it. It was absent for 0.3.0 through 0.3.2: the
      # attestation only means something when the commit is public, and this repository
      # was private while GitHub Support garbage-collected objects that had been purged
      # from history but stayed reachable. That finished on 17/09 and the repository is
      # public, so the flag is back.
      #
      # A package whose contents can be verified against its source is the only kind
      # this project has any business publishing: the whole argument of the tool is that
      # its numbers can be checked.
      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
